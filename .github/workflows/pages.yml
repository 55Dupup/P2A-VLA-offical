name: Deploy project website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/.nojekyll'
      - 'docs/assets/**'
      - 'docs/videos/**'
      - 'docs/tools/build_pages.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Assemble public website
        run: python3 docs/tools/build_pages.py --output _site
      - name: Save private preview
        uses: actions/upload-artifact@v4
        with:
          name: project-website-preview
          path: _site
          include-hidden-files: true
          retention-days: 7
      - name: Configure Pages
        if: vars.PUBLISH_PROJECT_WEBSITE == 'true' && github.event.repository.private == false
        uses: actions/configure-pages@v5
      - name: Upload website
        if: vars.PUBLISH_PROJECT_WEBSITE == 'true' && github.event.repository.private == false
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: vars.PUBLISH_PROJECT_WEBSITE == 'true' && github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
